# Site settings
name:        "Yu Zhang (张宇)"
title:       "Yu Zhang"
description: "Personal homepage of Yu Zhang"

# Deployment URL — user site, served at the root of yucrazing.github.io.
# baseurl is empty because this repo is named YuCrazing.github.io (the special
# GitHub user-pages repo), not a project repo under a sub-path.
url:         "https://yucrazing.github.io"
baseurl:     ""

# Short bio paragraph shown in the top header. Raw HTML, kept to one paragraph
# in the Jon-Barron style — a few concise sentences, no line breaks.
bio: "
<p>I am a PhD student at <a href='https://mmlab-ntu.com'>MMLab@NTU</a>, Nanyang Technological University, advised by <a href='https://xingangpan.github.io/'>Prof. Xingang Pan</a>. Previously I worked at the University of Utah, MeshyAI (Taichi Graphics) and Tencent Games. I earned my bachelor's and master's degrees in Computer Science from Beijing Normal University, advised by Prof. Zhongke Wu.</p>
"

# Short research-interests blurb shown under the "Research" h2 (Jon-Barron style:
# one sentence on what you study + one sentence on what you do, ending with
# "Some papers are highlighted." if you mark certain pubs as highlighted).
research_interests: "
<p>I am working at the intersection of physical simulation and AI.</p>
"

# Profile photo
avatar: "images/avatar-casual.png"

# Contact / external links (shown in the header link row, separated by ' / ').
# Use "#" as a placeholder for links you don't have yet — the link will still
# render so the layout matches Jon Barron's, but will not navigate anywhere.
email:        "yucrazing@gmail.com"
# cv_url:       "https://yucrazing.github.io/assets/files/YuZhang_CV_en.pdf"
# cv_url:       "#"
scholar_url:  "https://scholar.google.com/citations?user=8V9C6LAAAAAJ&hl=zh-TW"
github_url:   "https://github.com/YuCrazing/"
twitter_url:  "https://x.com/yucrazing"
# linkedin_url: "#"

# Cross-link from home to the secondary page
more_url:     "/more/"

# Optional link next to the "Selected Projects" heading
full_projects_url: "/pages/projects.html"

# Jekyll build settings
markdown: kramdown
sass:
  style: compressed

# Exclude from Jekyll build
exclude:
  - backup
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSE.template
  - _vendor
  - .travis.yml
  - "_make_*.sh"

# Permalink style for any posts (unused, but Jekyll needs a default)
# Posts inherit category "Others" (matching the old yucrazing.github.io repo)
# so legacy URLs like /others/2023/08/24/classical-pde-en.html keep resolving.
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      category: "Others"

permalink: /:categories/:year/:month/:day/:title.html
