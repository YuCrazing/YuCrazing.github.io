# Site settings
title: "Yu Zhang - Homepage"
description: "Personal homepage of Yu Zhang"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume / homepage settings
resume_avatar:                  "images/avatar-casual.png"
resume_name:                    "Yu Zhang (张宇)"
resume_affiliation:             "Research Assistant, University of Utah"

# Contact
resume_contact_email:           "yucrazing@mail.bnu.edu.cn"
resume_contact_telephone:       "#"
resume_contact_address:         "University of Utah"

# CV link (shown in the header link row)
resume_cv_url:                  "https://yucrazing.github.io/assets/files/YuZhang_CV_en.pdf"

# Header bio paragraph (HTML allowed)
resume_header_intro: "
<p>
  I am a research assistant in <a href='https://yangzzzy.github.io/'>Prof. Yin Yang</a>'s lab at the University of Utah.
  I am also collaborating with <a href='https://people.csail.mit.edu/ganchuang/'>Prof. Chuang Gan</a> on the
  <a href='https://genesis-embodied-ai.github.io/'>Genesis</a> project.
</p>
<p>
  Before joining Yin Yang's lab, I worked at MeshyAI (with <a href='https://tiantianliu.cn/'>Dr. Tiantian Liu</a> and
  <a href='https://yuanming.taichi.graphics/'>Dr. Yuanming Hu</a>) and Tencent Games, and interned at NetEase Games.
  I earned both my bachelor's and master's degrees in Computer Science and Technology from Beijing Normal University,
  advised by Prof. Zhongke Wu.
</p>
<p>
  My research interests include <strong>3D AIGC</strong>, <strong>Computer Graphics</strong>
  (especially physical simulation), and <strong>Robotics</strong>.
</p>
"

# Optional: link next to the "Selected Projects" heading
resume_full_projects_url:       "https://yucrazing.github.io/pages/projects"

