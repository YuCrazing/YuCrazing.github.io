# Author registry — central place for author homepages.
#
# Layout will look up each name in publications' `authors:` array against this
# file. To update an author's homepage, change it here once and every paper
# that lists them is updated automatically.
#
# Fields per entry:
#   url:  Homepage URL. Use "#" as a placeholder if you don't have one yet.
#         Omit the url field entirely to render the name as plain text.
#   bold: Set to true for the site owner; the name is wrapped in <b>.
#
# An asterisk suffix on the author name in a publication (e.g. "Zhongke Wu*")
# is preserved automatically by the layout — keys here should NOT include "*".

